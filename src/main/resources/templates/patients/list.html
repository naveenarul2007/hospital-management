<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | MediCare HMS'">Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('patients')}"></div>
<div class="main-content" id="mainContent">
<div th:replace="~{fragments/sidebar :: topbar}"></div>
<div th:replace="~{fragments/sidebar :: alerts}"></div>
<div class="page-content">

    <div class="page-header">
        <div>
            <h1 class="page-header-title"><i class="fas fa-users me-2 text-primary"></i>Patient Management</h1>
            <p class="page-header-subtitle">Manage all patient records and information</p>
        </div>
        <a href="/patients/new" class="btn btn-primary">
            <i class="fas fa-user-plus me-2"></i> Add New Patient
        </a>
    </div>

    <!-- Stats Row -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="mini-stat"><i class="fas fa-users text-primary"></i><div class="mini-val" th:text="${patients.size()}">0</div><div class="mini-label">Total Patients</div></div>
        </div>
        <div class="col-md-3">
            <div class="mini-stat"><i class="fas fa-user-check text-success"></i>
                <div class="mini-val" th:text="${patients.?[status == 'ACTIVE'].size()}">0</div>
                <div class="mini-label">Active</div></div>
        </div>
        <div class="col-md-3">
            <div class="mini-stat"><i class="fas fa-male text-info"></i>
                <div class="mini-val" th:text="${patients.?[gender == 'Male'].size()}">0</div>
                <div class="mini-label">Male</div></div>
        </div>
        <div class="col-md-3">
            <div class="mini-stat"><i class="fas fa-female text-pink"></i>
                <div class="mini-val" th:text="${patients.?[gender == 'Female'].size()}">0</div>
                <div class="mini-label">Female</div></div>
        </div>
    </div>

    <div class="data-table-container">
        <div class="data-table-header">
            <h5><i class="fas fa-list me-2 text-primary"></i>All Patients</h5>
            <form th:action="@{/patients}" method="get" class="d-flex gap-2">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" name="search" class="form-control" placeholder="Search patients..." th:value="${search}">
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Search</button>
                <a th:if="${search}" href="/patients" class="btn btn-secondary btn-sm">Clear</a>
            </form>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Patient ID</th>
                        <th>Name</th>
                        <th>Age/Gender</th>
                        <th>Phone</th>
                        <th>Blood Group</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="patient : ${patients}">
                        <td>
                            <span class="fw-bold text-primary" th:text="${patient.id}"></span>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="avatar-xs"><i class="fas fa-user"></i></div>
                                <div>
                                    <div class="fw-semibold" th:text="${patient.fullName}"></div>
                                    <small class="text-muted" th:text="${patient.email}"></small>
                                </div>
                            </div>
                        </td>
                        <td th:text="${patient.age + ' yrs / ' + patient.gender}"></td>
                        <td th:text="${patient.phone}"></td>
                        <td>
                            <span class="badge bg-danger-subtle text-danger fw-bold" th:text="${patient.bloodGroup}"></span>
                        </td>
                        <td th:text="${patient.email}"></td>
                        <td>
                            <span class="status-badge" 
                                th:classappend="${'status-' + patient.status.toLowerCase()}"
                                th:text="${patient.status}"></span>
                        </td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/patients/view/{id}(id=${patient.id})}" class="btn btn-outline-primary" title="View"><i class="fas fa-eye"></i></a>
                                <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-outline-primary" title="Edit"><i class="fas fa-edit"></i></a>
                                <form th:action="@{/patients/delete/{id}(id=${patient.id})}" method="post" style="display:inline;" data-confirm="Delete this patient?">
                                    <button type="submit" class="btn btn-outline-danger" title="Delete"><i class="fas fa-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(patients)}">
                        <td colspan="8" class="text-center py-5">
                            <i class="fas fa-users text-muted" style="font-size:40px;opacity:0.3;"></i>
                            <p class="mt-3 text-muted">No patients found. <a href="/patients/new">Add first patient</a></p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
