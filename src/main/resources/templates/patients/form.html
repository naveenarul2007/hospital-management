<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | MediCare HMS'">Patient Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('patients')}"></div>
<div class="main-content" id="mainContent">
<div th:replace="~{fragments/sidebar :: topbar}"></div>
<div th:replace="~{fragments/sidebar :: alerts}"></div>
<div class="page-content">

    <div class="page-header">
        <div>
            <h1 class="page-header-title">
                <i class="fas fa-user-plus me-2 text-primary"></i>
                <span th:text="${action == 'edit' ? 'Edit Patient' : 'Add New Patient'}">Patient Form</span>
            </h1>
            <p class="page-header-subtitle">Fill in the patient information below</p>
        </div>
        <a href="/patients" class="btn btn-secondary"><i class="fas fa-arrow-left me-2"></i>Back to List</a>
    </div>

    <form th:action="@{/patients/save}" th:object="${patient}" method="post" id="patientForm">
        <input type="hidden" th:field="*{id}">

        <!-- Personal Information -->
        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-user-circle"></i> Personal Information</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">First Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{firstName}" class="form-control" placeholder="Enter first name" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Last Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{lastName}" class="form-control" placeholder="Enter last name" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Gender <span class="text-danger">*</span></label>
                    <select th:field="*{gender}" class="form-select" required>
                        <option value="">-- Select Gender --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" th:field="*{dateOfBirth}" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Blood Group</label>
                    <select th:field="*{bloodGroup}" class="form-select">
                        <option value="">-- Select --</option>
                        <option value="A+">A+</option><option value="A-">A-</option>
                        <option value="B+">B+</option><option value="B-">B-</option>
                        <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        <option value="O+">O+</option><option value="O-">O-</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Contact Information -->
        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-phone"></i> Contact Information</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="Enter email" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Phone <span class="text-danger">*</span></label>
                    <input type="tel" th:field="*{phone}" class="form-control" placeholder="Enter phone" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Address</label>
                    <input type="text" th:field="*{address}" class="form-control" placeholder="Enter address">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Emergency Contact Name</label>
                    <input type="text" th:field="*{emergencyContact}" class="form-control" placeholder="Emergency contact name">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Emergency Contact Phone</label>
                    <input type="tel" th:field="*{emergencyPhone}" class="form-control" placeholder="Emergency contact phone">
                </div>
            </div>
        </div>

        <!-- Medical Information -->
        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-heartbeat"></i> Medical Information</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Known Allergies</label>
                    <textarea th:field="*{allergies}" class="form-control" rows="3" placeholder="List any known allergies..."></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Medical History</label>
                    <textarea th:field="*{medicalHistory}" class="form-control" rows="3" placeholder="Previous medical conditions, surgeries..."></textarea>
                </div>
            </div>
        </div>

        <div class="d-flex gap-3 justify-content-end">
            <a href="/patients" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i>
                <span th:text="${action == 'edit' ? 'Update Patient' : 'Save Patient'}">Save</span>
            </button>
        </div>
    </form>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
