<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | MediCare HMS'">Medicine Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('pharmacy')}"></div>
<div class="main-content" id="mainContent">
<div th:replace="~{fragments/sidebar :: topbar}"></div>
<div th:replace="~{fragments/sidebar :: alerts}"></div>
<div class="page-content">

    <div class="page-header">
        <div>
            <h1 class="page-header-title">
                <i class="fas fa-pills me-2 text-primary"></i>
                <span th:text="${medicine.id != null ? 'Edit Medicine' : 'Add New Medicine'}">Medicine Form</span>
            </h1>
            <p class="page-header-subtitle">Register new pharmaceutical product into pharmacy stock</p>
        </div>
        <a href="/pharmacy" class="btn btn-secondary"><i class="fas fa-arrow-left me-2"></i>Back to Inventory</a>
    </div>

    <form th:action="@{/pharmacy/save}" th:object="${medicine}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-capsules"></i> Drug & Pharmaceutical Information</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Brand / Trade Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Paracetamol 500mg, Amoxicillin 250mg" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Generic Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{genericName}" class="form-control" placeholder="e.g. Acetaminophen" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Dosage Form / Category <span class="text-danger">*</span></label>
                    <select th:field="*{category}" class="form-select" required>
                        <option value="">-- Select Dosage Form --</option>
                        <option value="Tablet">Tablet</option>
                        <option value="Capsule">Capsule</option>
                        <option value="Syrup">Syrup / Suspension</option>
                        <option value="Injection">Injection</option>
                        <option value="Ointment">Ointment / Cream</option>
                        <option value="Drops">Eye/Ear Drops</option>
                        <option value="Inhaler">Inhaler</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Manufacturer / Pharma Company <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{manufacturer}" class="form-control" placeholder="e.g. Cipla, Sun Pharma, Pfizer" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Batch Expiry Date <span class="text-danger">*</span></label>
                    <input type="date" th:field="*{expiryDate}" class="form-control" required>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-boxes"></i> Inventory & Unit Pricing</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Quantity in Stock <span class="text-danger">*</span></label>
                    <input type="number" min="0" th:field="*{quantity}" class="form-control" placeholder="e.g. 100" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Reorder / Minimum Threshold <span class="text-danger">*</span></label>
                    <input type="number" min="0" th:field="*{minimumStock}" class="form-control" placeholder="e.g. 20" required>
                    <div class="form-text">Alerts trigger when stock falls to or below this count.</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Unit Price (₹) <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" min="0" th:field="*{price}" class="form-control" placeholder="e.g. 25.00" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Description / Storage Instructions</label>
                    <textarea th:field="*{description}" class="form-control" rows="2" placeholder="e.g. Store below 25°C in a dry place. Protect from direct sunlight."></textarea>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-3 mb-5">
            <a href="/pharmacy" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-2"></i>Save Medicine</button>
        </div>
    </form>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
