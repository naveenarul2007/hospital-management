<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | MediCare HMS'">Book Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('appointments')}"></div>
<div class="main-content" id="mainContent">
<div th:replace="~{fragments/sidebar :: topbar}"></div>
<div th:replace="~{fragments/sidebar :: alerts}"></div>
<div class="page-content">

    <div class="page-header">
        <div>
            <h1 class="page-header-title">
                <i class="fas fa-calendar-plus me-2 text-primary"></i>
                <span th:text="${action == 'edit' ? 'Edit Appointment' : 'Book Appointment'}">Book Appointment</span>
            </h1>
            <p class="page-header-subtitle">Schedule a consultation between a patient and medical specialist</p>
        </div>
        <a href="/appointments" class="btn btn-secondary"><i class="fas fa-arrow-left me-2"></i>Back to List</a>
    </div>

    <form th:action="@{/appointments/save}" method="post">
        <input type="hidden" name="appointmentId" th:value="${appointment.id}">

        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-user-injured"></i> Patient & Specialist Selection</div>
            <div class="row g-3">
                <!-- Patient Selection -->
                <div class="col-md-6">
                    <label class="form-label">Select Patient <span class="text-danger">*</span></label>
                    <select name="patientId" class="form-select" required>
                        <option value="">-- Choose Patient --</option>
                        <option th:each="p : ${patients}" 
                                th:value="${p.id}" 
                                th:text="${p.fullName + ' (' + p.id + ' - ' + p.phone + ')'}"
                                th:selected="${p.id == appointment.patientId or p.id == param.patientId}"></option>
                    </select>
                    <div class="form-text">Or <a href="/patients/new" target="_blank">register a new patient</a> first.</div>
                </div>

                <!-- Department Selection -->
                <div class="col-md-6">
                    <label class="form-label">Medical Department <span class="text-danger">*</span></label>
                    <select name="department" id="department" class="form-select" onchange="loadDoctorsByDepartment(this.value)" required>
                        <option value="">-- Select Department --</option>
                        <option th:each="dept : ${departments}" 
                                th:value="${dept}" 
                                th:text="${dept}"
                                th:selected="${dept == appointment.department}"></option>
                    </select>
                </div>

                <!-- Doctor Selection -->
                <div class="col-md-6">
                    <label class="form-label">Consulting Doctor <span class="text-danger">*</span></label>
                    <select name="doctorId" id="doctorId" class="form-select" onchange="updateFee(this); checkSlotAvailability();" required>
                        <option value="">-- Select Doctor --</option>
                        <option th:each="doc : ${doctors}" 
                                th:value="${doc.id}" 
                                th:text="${doc.fullName + ' (' + doc.specialization + ' - ' + doc.department + ')'}"
                                th:attr="data-fee=${doc.consultationFee}"
                                th:selected="${doc.id == appointment.doctorId or doc.id == param.doctorId}"></option>
                    </select>
                </div>

                <!-- Consultation Fee (Readonly indicator) -->
                <div class="col-md-6">
                    <label class="form-label">Consultation Fee (₹)</label>
                    <input type="text" id="consultationFee" class="form-control" th:value="${appointment.consultationFee}" readonly placeholder="Select doctor to view fee">
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-clock"></i> Date, Time & Slot Availability</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Appointment Date <span class="text-danger">*</span></label>
                    <input type="date" name="appointmentDate" id="appointmentDate" class="form-control" 
                           th:value="${appointment.appointmentDate != null ? appointment.appointmentDate : #temporals.createToday()}"
                           onchange="checkSlotAvailability()" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Appointment Time <span class="text-danger">*</span></label>
                    <select name="appointmentTime" id="appointmentTime" class="form-select" onchange="checkSlotAvailability()" required>
                        <option value="">-- Select Time Slot --</option>
                        <option value="09:00" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '09:00'}">09:00 AM</option>
                        <option value="09:30" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '09:30'}">09:30 AM</option>
                        <option value="10:00" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '10:00'}">10:00 AM</option>
                        <option value="10:30" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '10:30'}">10:30 AM</option>
                        <option value="11:00" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '11:00'}">11:00 AM</option>
                        <option value="11:30" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '11:30'}">11:30 AM</option>
                        <option value="12:00" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '12:00'}">12:00 PM</option>
                        <option value="14:00" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '14:00'}">02:00 PM</option>
                        <option value="14:30" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '14:30'}">02:30 PM</option>
                        <option value="15:00" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '15:00'}">03:00 PM</option>
                        <option value="15:30" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '15:30'}">03:30 PM</option>
                        <option value="16:00" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '16:00'}">04:00 PM</option>
                        <option value="16:30" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '16:30'}">04:30 PM</option>
                        <option value="17:00" th:selected="${appointment.appointmentTime != null and appointment.appointmentTime.toString() == '17:00'}">05:00 PM</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Appointment Type</label>
                    <select name="type" class="form-select">
                        <option value="IN_PERSON" th:selected="${appointment.type == 'IN_PERSON'}">In-Person Consultation</option>
                        <option value="FOLLOW_UP" th:selected="${appointment.type == 'FOLLOW_UP'}">Follow-Up Visit</option>
                        <option value="EMERGENCY" th:selected="${appointment.type == 'EMERGENCY'}">Emergency Walk-In</option>
                    </select>
                </div>
                <div class="col-12">
                    <div id="slotIndicator" style="display:none;"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Reason for Visit / Symptoms</label>
                    <textarea name="reason" class="form-control" rows="3" placeholder="Briefly describe symptoms, chief complaint, or purpose of visit..." th:text="${appointment.reason}"></textarea>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-3 mb-5">
            <a href="/appointments" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary px-4"><i class="fas fa-check-circle me-2"></i>Confirm Appointment</button>
        </div>
    </form>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
