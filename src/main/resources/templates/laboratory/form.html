<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | MediCare HMS'">Order Lab Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('laboratory')}"></div>
<div class="main-content" id="mainContent">
<div th:replace="~{fragments/sidebar :: topbar}"></div>
<div th:replace="~{fragments/sidebar :: alerts}"></div>
<div class="page-content">

    <div class="page-header">
        <div>
            <h1 class="page-header-title">
                <i class="fas fa-flask me-2 text-primary"></i>
                <span th:text="${test.id != null ? 'Edit Lab Test' : 'Order New Lab Test'}">Order Lab Test</span>
            </h1>
            <p class="page-header-subtitle">Request pathology investigation, blood tests, or diagnostic imaging</p>
        </div>
        <a href="/laboratory" class="btn btn-secondary"><i class="fas fa-arrow-left me-2"></i>Back to Lab</a>
    </div>

    <form th:action="@{/laboratory/save}" method="post">
        <input type="hidden" name="testId" th:value="${test.id}">

        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-user-injured"></i> Patient & Referring Physician</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Patient <span class="text-danger">*</span></label>
                    <select name="patientId" class="form-select" required>
                        <option value="">-- Select Patient --</option>
                        <option th:each="p : ${patients}"
                                th:value="${p.id}"
                                th:text="${p.fullName + ' (' + p.id + ')'}"
                                th:selected="${p.id == test.patientId or p.id == param.patientId}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Referring Doctor <span class="text-danger">*</span></label>
                    <select name="doctorId" class="form-select" required>
                        <option value="">-- Select Doctor --</option>
                        <option th:each="d : ${doctors}"
                                th:value="${d.id}"
                                th:text="${d.fullName + ' (' + d.department + ')'}"
                                th:selected="${d.id == test.doctorId or d.id == param.doctorId}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-microscope"></i> Test Investigation Details</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Investigation / Test Name <span class="text-danger">*</span></label>
                    <input type="text" name="testName" class="form-control" th:value="${test.testName}" 
                           placeholder="e.g. Complete Blood Count (CBC), Fasting Lipid Profile" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Test Category / Sample Type <span class="text-danger">*</span></label>
                    <select name="testType" class="form-select" required>
                        <option value="BLOOD" th:selected="${test.testType == 'BLOOD'}">Blood Pathology</option>
                        <option value="URINE" th:selected="${test.testType == 'URINE'}">Urine Analysis</option>
                        <option value="XRAY" th:selected="${test.testType == 'XRAY'}">X-Ray Radiology</option>
                        <option value="MRI" th:selected="${test.testType == 'MRI'}">MRI Scan</option>
                        <option value="CT_SCAN" th:selected="${test.testType == 'CT_SCAN'}">CT Scan</option>
                        <option value="ULTRASOUND" th:selected="${test.testType == 'ULTRASOUND'}">Ultrasound Sonography</option>
                        <option value="BIOPSY" th:selected="${test.testType == 'BIOPSY'}">Histopathology / Biopsy</option>
                        <option value="OTHER" th:selected="${test.testType == 'OTHER'}">Other</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Standard Charge (₹) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text">₹</span>
                        <input type="number" step="0.01" min="0" name="price" class="form-control" 
                               th:value="${test.price != 0 ? test.price : 450.0}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Linked Appointment Ref (Optional)</label>
                    <input type="text" name="appointmentId" class="form-control" th:value="${test.appointmentId}" placeholder="e.g. APT-5001">
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-3 mb-5">
            <a href="/laboratory" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary px-4"><i class="fas fa-vial me-2"></i>Order Investigation</button>
        </div>
    </form>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
