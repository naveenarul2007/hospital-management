<!-- Common Sidebar + Topbar Macro for all pages -->
<!-- Include this in every page using th:replace -->
<div th:fragment="sidebar(currentPage)">
<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><i class="fas fa-hospital-alt"></i></div>
        <div class="brand-text">
            <span class="brand-name">MediCare</span>
            <span class="brand-sub">HMS</span>
        </div>
    </div>
    <div class="sidebar-user">
        <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
        <div class="user-info">
            <div class="user-name" th:text="${currentUser}">User</div>
            <div class="user-role" th:text="${userRole != null ? userRole.replace('ROLE_','') : ''}">Role</div>
        </div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section-title">MAIN MENU</div>
        <a href="/dashboard" th:classappend="${currentPage=='dashboard'?'active':''}" class="nav-link"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
        <a href="/patients" th:classappend="${currentPage=='patients'?'active':''}" class="nav-link"><i class="fas fa-users"></i> <span>Patients</span></a>
        <a href="/doctors" th:classappend="${currentPage=='doctors'?'active':''}" class="nav-link"><i class="fas fa-user-md"></i> <span>Doctors</span></a>
        <a href="/appointments" th:classappend="${currentPage=='appointments'?'active':''}" class="nav-link"><i class="fas fa-calendar-check"></i> <span>Appointments</span></a>
        <a href="/medical-records" th:classappend="${currentPage=='medical-records'?'active':''}" class="nav-link"><i class="fas fa-file-medical"></i> <span>Medical Records</span></a>
        <div class="nav-section-title">SERVICES</div>
        <a href="/pharmacy" th:classappend="${currentPage=='pharmacy'?'active':''}" class="nav-link"><i class="fas fa-pills"></i> <span>Pharmacy</span></a>
        <a href="/laboratory" th:classappend="${currentPage=='laboratory'?'active':''}" class="nav-link"><i class="fas fa-flask"></i> <span>Laboratory</span></a>
        <a href="/billing" th:classappend="${currentPage=='billing'?'active':''}" class="nav-link"><i class="fas fa-file-invoice-dollar"></i> <span>Billing</span></a>
        <div class="nav-section-title">ADMINISTRATION</div>
        <a href="/staff" th:classappend="${currentPage=='staff'?'active':''}" class="nav-link"><i class="fas fa-id-badge"></i> <span>Staff</span></a>
        <a href="/reports" th:classappend="${currentPage=='reports'?'active':''}" class="nav-link"><i class="fas fa-chart-bar"></i> <span>Reports</span></a>
        <a href="/logout" class="nav-link nav-logout"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
    </nav>
</div>
</div>

<div th:fragment="topbar">
<div class="topbar">
    <div class="topbar-left">
        <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <div class="page-title-area">
            <h2 class="page-title" th:text="${pageTitle}">Page</h2>
            <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="/dashboard">Home</a></li><li class="breadcrumb-item active" th:text="${pageTitle}"></li></ol></nav>
        </div>
    </div>
    <div class="topbar-right">
        <div class="dropdown">
            <button class="topbar-btn position-relative" data-bs-toggle="dropdown">
                <i class="fas fa-bell"></i>
                <span class="notif-badge" th:if="${unreadCount > 0}" th:text="${unreadCount}"></span>
            </button>
            <div class="dropdown-menu dropdown-menu-end notif-dropdown" style="max-height:400px;overflow-y:auto;">
                <div class="notif-header"><span>Notifications</span><a href="#" onclick="markAllRead()" style="font-size:12px;">Mark all read</a></div>
                <div class="notif-empty"><i class="fas fa-bell-slash text-muted mb-2"></i><p class="mb-0">No notifications</p></div>
            </div>
        </div>
        <div class="dropdown">
            <button class="topbar-user-btn" data-bs-toggle="dropdown">
                <div class="user-avatar-sm"><i class="fas fa-user"></i></div>
                <span th:text="${currentUser}">User</span>
                <i class="fas fa-chevron-down ms-1" style="font-size:10px;"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item text-danger" href="/logout"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
            </ul>
        </div>
    </div>
</div>
</div>

<div th:fragment="alerts">
<div class="container-fluid px-4 pt-3" th:if="${successMessage != null or errorMessage != null}">
    <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show d-flex align-items-center"><i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span><button class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center"><i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span><button class="btn-close" data-bs-dismiss="alert"></button></div>
</div>
</div>
