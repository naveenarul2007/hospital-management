<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare HMS - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0a2540 0%, #1a6fa6 50%, #0d8bcd 100%); min-height: 100vh; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; }
        .login-wrapper { width: 100%; max-width: 480px; padding: 20px; }
        .login-card { background: rgba(255,255,255,0.97); border-radius: 20px; padding: 40px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, #1a6fa6, #0d8bcd); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; box-shadow: 0 8px 25px rgba(26,111,166,0.35); }
        .logo-icon i { color: white; font-size: 32px; }
        .logo-area h1 { font-size: 24px; font-weight: 700; color: #0a2540; margin: 0; }
        .logo-area p { color: #6b7280; font-size: 14px; margin: 4px 0 0; }
        .form-label { font-weight: 600; color: #374151; font-size: 13px; }
        .form-control { border: 2px solid #e5e7eb; border-radius: 10px; padding: 12px 15px; font-size: 14px; transition: all 0.3s; }
        .form-control:focus { border-color: #1a6fa6; box-shadow: 0 0 0 3px rgba(26,111,166,0.15); }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 15px; z-index: 5; }
        .input-icon .form-control { padding-left: 42px; }
        .btn-login { background: linear-gradient(135deg, #1a6fa6, #0d8bcd); border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600; color: white; width: 100%; transition: all 0.3s; letter-spacing: 0.3px; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(26,111,166,0.4); background: linear-gradient(135deg, #155d8c, #0a7ab5); }
        .divider { text-align: center; margin: 20px 0; position: relative; color: #9ca3af; font-size: 13px; }
        .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #e5e7eb; }
        .divider::before { left: 0; } .divider::after { right: 0; }
        .demo-creds { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 16px; margin-top: 20px; }
        .demo-creds h6 { color: #0369a1; font-weight: 700; font-size: 13px; margin-bottom: 12px; }
        .cred-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #bae6fd; font-size: 12px; cursor: pointer; }
        .cred-item:last-child { border: none; margin-bottom: 0; }
        .cred-role { font-weight: 600; color: #0369a1; }
        .cred-details { color: #374151; }
        .cred-badge { background: #0369a1; color: white; padding: 2px 8px; border-radius: 20px; font-size: 11px; }
        .alert { border-radius: 10px; font-size: 14px; border: none; }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fas fa-hospital-alt"></i>
            </div>
            <h1>MediCare HMS</h1>
            <p>Hospital Management System</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${logoutMessage}" class="alert alert-success d-flex align-items-center" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${logoutMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-login">
                <i class="fas fa-sign-in-alt me-2"></i> Sign In to Dashboard
            </button>
        </form>

        <div class="demo-creds">
            <h6><i class="fas fa-key me-1"></i> Demo Credentials</h6>
            <div class="cred-item" onclick="fillCreds('admin','admin123')">
                <span class="cred-role"><i class="fas fa-user-shield me-1"></i> Admin</span>
                <span class="cred-details">admin / admin123</span>
                <span class="cred-badge">Click</span>
            </div>
            <div class="cred-item" onclick="fillCreds('doctor','doctor123')">
                <span class="cred-role"><i class="fas fa-user-md me-1"></i> Doctor</span>
                <span class="cred-details">doctor / doctor123</span>
                <span class="cred-badge">Click</span>
            </div>
            <div class="cred-item" onclick="fillCreds('receptionist','recep123')">
                <span class="cred-role"><i class="fas fa-user-tie me-1"></i> Receptionist</span>
                <span class="cred-details">receptionist / recep123</span>
                <span class="cred-badge">Click</span>
            </div>
            <div class="cred-item" onclick="fillCreds('patient','patient123')">
                <span class="cred-role"><i class="fas fa-user me-1"></i> Patient</span>
                <span class="cred-details">patient / patient123</span>
                <span class="cred-badge">Click</span>
            </div>
        </div>
    </div>
</div>
<script>
function fillCreds(user, pass) {
    document.querySelector('input[name="username"]').value = user;
    document.querySelector('input[name="password"]').value = pass;
}
</script>
</body>
</html>
